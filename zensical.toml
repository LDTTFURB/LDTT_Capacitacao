
[project]
site_name = "LDTT HUB"
site_url = "https://ldttfurb.github.io/LDTT_Capacitacao/"
site_description = "HUB de Capacitação do LDTT/FURB"
site_author = "LDTT - FURB"
docs_dir = "docs"
copyright = "LDTT - Universidade Regional de Blumenau"


nav = [
  { "Início" = "index.md" },
  { "Trilhas" = "trilhas/index.md" },
  { "Enviar Tutorial" = "enviar-tutorial.md" },
]


extra_javascript = [
  "assets/js/header-home.js",
  "assets/js/trilhas-filter.js",
]

[project.theme]
language = "pt-BR"
features = [
  "navigation.tabs",
  "navigation.top",
]

[project.theme.palette]
scheme = "default"
primary = "blue"
accent = "blue"

[project.plugins.search]
enabled = false

[project.markdown_extensions]
attr_list = {}
