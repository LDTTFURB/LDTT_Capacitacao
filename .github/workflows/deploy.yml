
name: Publicar HUB LDTT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      
      - name: Instalar dependencias
        run: pip install zensical pyyaml

      
      - name: Gerar cards dos tutoriais
        run: python scripts/gerar_cards.py

      - name: Gerar arvores das trilhas
        run: python scripts/gerar_arvores.py

      - name: Gerar site
        run: zensical build --clean



      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
